name: Android CI

on:
  push:
    branches: [ "release", "develop" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
    - uses: actions/checkout@v4

    - name: Extract applicationId and versionName from build.gradle
      id: get_app_info
      run: |
        APP_ID=$(grep -oP 'applicationId\s+["'\'']\K[^"'\'']+' app/build.gradle)
        VERSION_NAME=$(grep -oP 'versionName\s+["'\'']\K[^"'\'']+' app/build.gradle)
        
        if [ -z "$APP_ID" ] || [ -z "$VERSION_NAME" ]; then
          echo "❌ Failed to extract applicationId or versionName from app/build.gradle"
          exit 1
        fi

        APP_NAME=$(echo "$APP_ID" | awk -F '.' '{print $NF}')
        
        if [ -z "$APP_NAME" ]; then
          echo "❌ Failed to extract app name from applicationId: $APP_ID"
          exit 1
        fi

        RUN_NUMBER=${{ github.run_number }}
        if [ "${{ github.ref_name }}" == "develop" ]; then
          FILENAME="${APP_NAME}-${VERSION_NAME}.${RUN_NUMBER}-develop.apk"
        else
          FILENAME="${APP_NAME}-${VERSION_NAME}.${RUN_NUMBER}-release.apk"
        fi

        echo "application_id=$APP_ID" >> $GITHUB_OUTPUT
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "apk_filename=$FILENAME" >> $GITHUB_OUTPUT
        echo "apk_path=app/build/outputs/apk/release/$FILENAME" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/verba.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Rename APK to dynamic filename
      run: |
        ORIGINAL=app/build/outputs/apk/release/app-release.apk
        TARGET=${{ steps.get_app_info.outputs.apk_path }}
        mv "$ORIGINAL" "$TARGET"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: ${{ steps.get_app_info.outputs.apk_path }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_app_info.outputs.version_name }}.${{ github.run_number }}
        name: ${{ github.ref_name == 'develop' && 'Dev Build' || 'Release' }} ${{ steps.get_app_info.outputs.version_name }}.${{ github.run_number }}
        draft: ${{ github.ref_name == 'develop' }}
        prerelease: ${{ github.ref_name == 'develop' }}
        files: ${{ steps.get_app_info.outputs.apk_path }}